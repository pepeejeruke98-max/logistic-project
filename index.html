<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargo Freight Logistics Ltd.</title>

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
  </head>

  <body class="bg-white text-gray-900">

    <!-- Header -->
    <header class="absolute top-0 left-0 w-full z-20">
      <div class="container mx-auto px-6 py-5 flex justify-between items-center">

        <!-- Logo -->
        <a href="#">
          <img-
            src="image.png"
            alt="Cargo Freight Logistics Ltd. logo"
            class="h-12 w-auto"
          />
        </a>

        <!-- Navigation -->
        <nav>
          <ul class="flex items-center space-x-8 text-white font-medium">
            <li>
              <a href="#" class="hover:text-red-400 transition duration-300">
                Home
              </a>
            </li>

            <li>
              <a href="#" class="hover:text-red-400 transition duration-300">
                About
              </a>
            </li>

            <li>
              <a href="#" class="hover:text-red-400 transition duration-300">
                Services
              </a>
            </li>

            <li>
              <a href="#" class="hover:text-red-400 transition duration-300">
                Contact
              </a>
            </li>
          </ul>
        </nav>

      </div>
    </header>


    <!-- Hero Section -->
    <main>

      <section
        class="relative min-h-screen flex items-center bg-cover bg-center"
        style="
          background-image: url('./16e0010ae58db5f03e4ecc4aa14f42e6558804d8%20(1).jpg');
        "
      >

        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-black/65"></div>

        <!-- Optional subtle gradient -->
        <div
          class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/60 to-black/30"
        ></div>

        <!-- Hero Content -->
        <div class="container mx-auto px-6 relative z-10">

          <div class="max-w-3xl text-white">

            <p class="text-red-500 uppercase tracking-[0.3em] font-semibold mb-4">
              Reliable • Fast • Global
            </p>

            <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-4">
              Welcome To
            </h1>

            <h2 class="text-4xl md:text-6xl font-bold leading-tight mb-6">
              Cargo Freight
              <span class="text-red-500">Logistics Ltd.</span>
            </h2>

            <p class="text-lg md:text-xl text-gray-200 leading-relaxed max-w-2xl mb-8">
              Your trusted partner for efficient freight forwarding,
              transportation, and logistics solutions. We move your cargo
              safely, securely, and on time.
            </p>

            <!-- Buttons -->
            <div class="flex flex-wrap gap-4">

              <a
                href="#"
                class="inline-block bg-[#EA2F2F] text-white px-7 py-3 rounded-md font-semibold hover:bg-red-700 transition duration-300 shadow-lg"
              >
                Request Quote
              </a>

              <a
                href="#"
                class="inline-block border border-white text-white px-7 py-3 rounded-md font-semibold hover:bg-white hover:text-gray-900 transition duration-300"
              >
                Learn More
              </a>

            </div>

          </div>

        </div>
      </section>

    </main>

  </body>
</html>
